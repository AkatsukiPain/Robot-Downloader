<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Downloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app">
    <section class="panel compact-toolbar">
      <div class="hero-actions hero-actions-inline">
        <button id="themeToggleButton" class="button secondary">Dark theme</button>
        <button id="refreshButton" class="button secondary">Refresh</button>
      </div>
    </section>

    <section class="panel panel-stack">
      <div class="panel-title-row">
        <h2>Jobs</h2>
        <span id="jobCount" class="pill">0</span>
      </div>
      <div id="jobsContainer" class="jobs empty">No jobs yet.</div>
    </section>

    <section class="panel panel-stack">
      <div class="panel-title-row">
        <div>
          <h2>Overview</h2>
          <p class="muted small">At-a-glance download queue state</p>
        </div>
        <label class="toggle-row auto-refresh-toggle">
          <input id="autoRefreshInput" type="checkbox" checked />
          <span>Auto refresh</span>
        </label>
      </div>
      <div class="stat-grid stat-grid-4">
        <article class="stat-card">
          <span class="stat-label">Total</span>
          <strong id="summaryTotal">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Active</span>
          <strong id="summaryActive">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Done</span>
          <strong id="summaryCompleted">0</strong>
        </article>
        <article class="stat-card">
          <span class="stat-label">Failed</span>
          <strong id="summaryFailed">0</strong>
        </article>
      </div>
      <div class="toolbar-grid">
        <label>
          Search jobs
          <input id="searchInput" type="search" placeholder="Filename, URL, or job id" />
        </label>
        <label>
          Status filter
          <select id="statusFilterInput">
            <option value="all">All statuses</option>
            <option value="downloading">Downloading</option>
            <option value="planned">Planned</option>
            <option value="queued">Queued</option>
            <option value="completed">Completed</option>
            <option value="failed">Failed</option>
          </select>
        </label>
      </div>
      <p id="jobsInfoMessage" class="status muted">Showing all jobs.</p>
    </section>

    <section class="panel panel-stack">
      <div class="panel-title-row">
        <div>
          <h2>Settings</h2>
          <p class="muted small">Firefox-side helper defaults</p>
        </div>
      </div>
      <form id="settingsForm" class="settings-grid">
        <label>
          Helper name
          <input id="helperNameInput" name="helperName" type="text" placeholder="robot.downloader" />
        </label>
        <label>
          Max connections
          <input id="maxConnectionsInput" name="maxConnections" type="number" min="1" max="32" />
        </label>
        <label>
          Chunk size (MB)
          <input id="chunkSizeInput" name="chunkSizeMb" type="number" min="1" max="256" />
        </label>
        <label>
          Retry count
          <input id="retryCountInput" name="retryCount" type="number" min="0" max="10" />
        </label>
        <label class="toggle-row span-all">
          <input id="autoInterceptInput" name="autoIntercept" type="checkbox" />
          <span>Auto-intercept Firefox downloads</span>
        </label>
        <div class="actions-row span-all">
          <button type="submit" class="button primary">Save settings</button>
        </div>
      </form>
      <p id="settingsMessage" class="status muted">Settings are stored locally in Firefox.</p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
