<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Downloader</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main class="app bridge-app">
    <section class="panel panel-stack">
      <div class="panel-title-row">
        <div>
          <h2>Robot Downloader Bridge</h2>
          <p class="muted small">Firefox catches media/page events. The local app owns the queue and UX.</p>
        </div>
      </div>

      <div class="stat-grid stat-grid-compact">
        <article class="stat-card">
          <span class="stat-label">Bridge</span>
          <strong id="bridgeStatus">Checking…</strong>
        </article>
      </div>

      <div class="actions-row wrap-actions">
        <button id="openAppButton" class="button primary">Open downloader app</button>
        <button id="refreshStatusButton" class="button secondary">Refresh status</button>
      </div>

      <form id="quickSendForm" class="settings-grid">
        <label>
          Quick-send URL
          <input id="quickUrlInput" type="url" placeholder="https://example.com/video.mp4" />
        </label>
        <label>
          Filename hint
          <input id="quickFilenameInput" type="text" placeholder="Optional filename" />
        </label>
        <label>
          YouTube quality
          <select id="quickQualityInput">
            <option value="highest">Highest available</option>
            <option value="2160p">Up to 2160p</option>
            <option value="1440p">Up to 1440p</option>
            <option value="1080p">Up to 1080p</option>
            <option value="720p">Up to 720p</option>
            <option value="480p">Up to 480p</option>
            <option value="360p">Up to 360p</option>
          </select>
        </label>
        <div class="actions-row span-all wrap-actions">
          <button type="submit" class="button primary">Send to downloader</button>
          <button id="sendCurrentTabButton" type="button" class="button secondary">Send current tab</button>
        </div>
      </form>

      <p id="statusMessage" class="status muted">Ready.</p>
    </section>

    <section class="panel panel-stack">
      <div class="panel-title-row">
        <div>
          <h2>Bridge settings</h2>
          <p class="muted small">These defaults are only used when forwarding jobs.</p>
        </div>
      </div>
      <form id="settingsForm" class="settings-grid">
        <label>
          Helper name
          <input id="helperNameInput" name="helperName" type="text" placeholder="robot.downloader" />
        </label>
        <label>
          Max connections
          <input id="maxConnectionsInput" name="maxConnections" type="number" min="1" max="32" />
        </label>
        <label>
          Chunk size (MB)
          <input id="chunkSizeInput" name="chunkSizeMb" type="number" min="1" max="256" />
        </label>
        <label>
          Retry count
          <input id="retryCountInput" name="retryCount" type="number" min="0" max="10" />
        </label>
        <label>
          Default YouTube quality
          <select id="youtubeQualityInput" name="youtubeQuality">
            <option value="highest">Highest available</option>
            <option value="2160p">Up to 2160p</option>
            <option value="1440p">Up to 1440p</option>
            <option value="1080p">Up to 1080p</option>
            <option value="720p">Up to 720p</option>
            <option value="480p">Up to 480p</option>
            <option value="360p">Up to 360p</option>
          </select>
        </label>
        <label class="toggle-row span-all">
          <input id="autoInterceptInput" name="autoIntercept" type="checkbox" />
          <span>Auto-intercept Firefox downloads</span>
        </label>
        <div class="actions-row span-all wrap-actions">
          <button type="submit" class="button primary">Save settings</button>
        </div>
      </form>
      <p id="settingsMessage" class="status muted">Settings are stored locally in Firefox.</p>
    </section>
  </main>

  <script src="popup.js"></script>
</body>
</html>
